}

message RmtCmdReq {
  RmtCmdList cmd_id = 1;
  RmtSubCmdLcd sub_cmd_lcd = 2;
  RmtSubCmdGps sub_cmd_gps = 3;
  RmtSubCmdBt sub_cmd_bt = 4;
  RmtSubCmdBle sub_cmd_ble = 5;
  RmtSubCmdWifi sub_cmd_wifi = 6;
  RmtSubCmdSpkr sub_cmd_spkr = 7;
  RmtSubCmdMic sub_cmd_mic = 8;
  RmtSubCmdMcuCal sub_cmd_mcu_cal = 9;
  RmtSubCmdVin sub_cmd_vin = 10;
  RmtSubCmdProv sub_cmd_prov = 11;
  RmtSubCmdSwUpdate sub_cmd_sw_update = 12;
  string cmd_input_str = 13;
  bytes cmd_input_bytes = 14;
  RmtSubCmdEsim sub_cmd_esim = 15;
}

message RmtCmdResp {
  RmtCmdList cmd_id = 1;
  RmtCmdRespStatus resp_status = 2;
  string resp_str = 3;
  bytes resp_bytes = 4;
}

message NavigationConfig {
