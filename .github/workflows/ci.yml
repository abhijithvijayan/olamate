name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate gRPC stubs
        run: |
          python -m grpc_tools.protoc \
            -I proto \
            --python_out=collector \
            --grpc_python_out=collector \
            proto/wifican.proto
          python scripts/fix_grpc_imports.py

      - name: Run collector tests
        run: python -m pytest collector/tests/ -v

      - name: Run API tests
        run: cd api && python -m pytest tests/ -v

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build dashboard
        run: |
          cd dashboard
          npm ci
          npm run build
