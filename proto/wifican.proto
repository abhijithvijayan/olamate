// Extracted from /vendor/bin/diagnostics_server on a Gen 1 head unit.
//
// The Go binary embeds a serialized FileDescriptorProto for every .proto
// it was compiled from. This file is that descriptor decoded back to
// source — it is the authoritative definition, not a guess or a copy.
//
// 42 RPC methods, 26 messages, 20 enums.
//
// WARNING: some methods change vehicle state. Do not call SwUpdate*,
// ProvisionVin, ProvisionConfig, ScooterModeChange, RemoveWifiCredentials,
// GenerateCerts, RegisterInstallCerts, or Deinit unless you understand
// exactly what they do.

syntax = "proto3";

package wifican;

