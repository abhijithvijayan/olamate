}

message EcosDynoFlags {
  RespStatus status = 1;
  string ecos1 = 2;
  string ecos2 = 3;
  string dyno = 4;
}

message EcosFlag {
  int32 ecosType = 1;
  string flag = 2;
}

message DynoFlag {
  string flag = 1;
}

message FileRequest {
  bytes file_data = 1;
  string file_path = 2;
  string file_name = 3;
}

message Command {
  string cmd_msg = 1;
}

message PackageName {
  string name = 1;
}

service WifiCanRpc {
  rpc Init (Register) returns (Response);
  rpc Deinit (google.protobuf.Empty) returns (Response);
  rpc CheckManifestFile (google.protobuf.Empty) returns (Response);
  rpc ReadCanFrame (google.protobuf.Empty) returns (CANPacket);
  rpc WriteCanFrame (CANPacket) returns (Response);
  rpc ReadCanStream (google.protobuf.Empty) returns (stream CANPacket);
  rpc WriteCanStream (stream CANPacket) returns (Response);
  rpc CanDumpStream (google.protobuf.Empty) returns (stream CANPacket);
  rpc GetVehicleOperationMode (google.protobuf.Empty) returns (VehicleOperationMode);
  rpc SetVehicleOperationMode (VehicleOperationMode) returns (Response);
  rpc SwUpdateFileClearCache (google.protobuf.Empty) returns (Response);
  rpc SwUpdateFileTransferMeta (SwUpdateFileMetadataReq) returns (Response);
  rpc SwUpdateFileTransfer (stream SwUpdateFileChunk) returns (SwUpdateFileMetadataResp);
  rpc SwUpdateTriggerUpgrade (SwUpdateTriggerCmd) returns (Response);
  rpc SwUpdateCheckStatus (google.protobuf.Empty) returns (SwUpdateStatus);
  rpc SwUpdateTestSetStatus (SwUpdateStatus) returns (Response);
  rpc SetEcosFlag (EcosFlag) returns (Response);
  rpc SetDynoFlag (DynoFlag) returns (Response);
  rpc GetEcosDynoFlags (google.protobuf.Empty) returns (EcosDynoFlags);
  rpc GetSwVersion (google.protobuf.Empty) returns (Response);
  rpc GetAospVersion (google.protobuf.Empty) returns (Response);
  rpc GenerateCerts (google.protobuf.Empty) returns (Response);
  rpc RegisterInstallCerts (google.protobuf.Empty) returns (Response);
  rpc ValidateCerts (google.protobuf.Empty) returns (Response);
  rpc RegisterNavigation (NavigationConfig) returns (Response);
  rpc ProvisionVin (Vin) returns (Response);
  rpc ProvisionConfig (Config) returns (Response);
  rpc GetVehicleIdentifiers (google.protobuf.Empty) returns (VehicleIdentifiers);
  rpc ConfigUpdate (google.protobuf.Empty) returns (ConfigUpdateResp);
  rpc TechPackUpdate (ConfigType) returns (ConfigUpdateResp);
  rpc RemoveWifiCredentials (google.protobuf.Empty) returns (Response);
  rpc ClearStorage (PackageName) returns (Response);
  rpc ScooterModeChange (google.protobuf.Empty) returns (Response);
  rpc RemoteRunTestCmd (RmtCmdReq) returns (RmtCmdResp);
  rpc InitConnection (Connection) returns (Response);
  rpc LocalGetConnection (google.protobuf.Empty) returns (stream Connection);
  rpc LocalRunTestStream (stream RmtCmdResp) returns (stream RmtCmdReq);
  rpc LocalGetTestCmd (google.protobuf.Empty) returns (RmtCmdReq);
  rpc LocalSendTestResp (RmtCmdResp) returns (Response);
  rpc pushFile (FileRequest) returns (Response);
  rpc ExecuteADBCommand (Command) returns (Response);
  rpc RunSystemTestCmd (SystemTestCmd) returns (SystemTestResp);
}
